[package]
name = "nova-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NovaOS microkernel"

# The kernel is a single binary: `main.rs` is the crate root and there is no
# library target, because exposing kernel internals to the workspace would let a
# future crate depend on page-table internals and quietly couple to them.
[[bin]]
name = "nova-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = { workspace = true }

# The ABI crate is a real dependency of the kernel, not a declaration of intent.
# It is `no_std` and architecture-neutral, so it links into the bare-metal
# target unchanged, and it is the single source of truth for the numbers the
# kernel exposes: a syscall name in a panic message and the number the CPU
# dispatches on must not be able to drift apart.
#
# Cargo warns about an unused `[workspace.dependencies]` entry, and that warning
# is the manifest keeping this honest -- if the dependency is ever dropped from
# here while the crate still exists, the warning says so.
nova-abi = { workspace = true }

# The address-space, scheduler, and syscall-dispatch algorithms live in
# `nova-core` so the host test suite exercises exactly the code the kernel
# runs, rather than a re-implementation of it. The kernel supplies the
# mechanism -- the page tables, the trap entry -- and the crate supplies the
# policy.
nova-core = { workspace = true }

# The ELF64 parser and image builder. The kernel loads a user image with it,
# and the host tests validate malformed images with the same parser the kernel
# uses, so a rejected image is rejected for the same reason in both places.
nova-elf = { workspace = true }

[lints.rust]
# An `unsafe` operation inside an `unsafe fn` must be inside its own `unsafe`
# block, so every one of them carries an explicit SAFETY comment. The kernel's
# unsafe surface is the whole of its privileged surface; this makes it auditable
# by reading, not by running the compiler's judgement.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Every `unsafe` block must be adjacent to a `// SAFETY:` comment. This is the
# mechanical half of "all new unsafe has a safety comment"; the other half is
# that the comment must actually state the invariant.
undocumented_unsafe_blocks = "warn"
# An `unsafe fn` must document why it is unsafe, or the reader has no way to
# know what the caller must guarantee.
missing_safety_doc = "deny"
# The `arch::capabilities` module re-exports the capability traits under their
# public spelling. Each re-export is genuinely used by callers outside this
# crate, so the lint cannot tell, and the project bans inline `#[allow]`
# attributes. The lint table is where a project-wide policy belongs; the
# inline attribute would be the policy applied at the point of application.
unused_imports = "allow"