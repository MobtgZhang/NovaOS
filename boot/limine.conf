# NovaOS Limine configuration (reference copy)
#
# This file is the human-readable, version-controlled form of the configuration
# that `cargo xtask image` writes into `target/novaos/stage/boot/limine.cfg`.
# The generated copy is authoritative for a build — it comes from
# `tools/xtask/src/boot.rs`'s `LIMINE_CONFIG` — and this file exists so the
# layout is reviewable without reading Rust. If the two disagree, the generated
# one wins; keeping them in sync is checked by `tools/xtask/src/boot.rs`'s tests.
#
# The staged file is generated rather than copied because the kernel path has to
# match the *built* kernel's name, which is a property of the build and not of the
# tree. A hand-maintained config that drifts from the artifact boots the wrong
# file, or none.

timeout: 0

# The `boot():` prefix names the ISO resource prefix explicitly. On Limine 12.x
# a bare path like `/boot/nova-kernel.elf` is resolved against an implicit prefix
# that does not reliably match how the ISO was built, and the failure is
# `PANIC: Failed to open executable` with no kernel output at all.
kernel_path: boot():/boot/nova-kernel.elf

# Placeholder for M2. Pointing this at a file that does not exist makes Limine
# report a module error after it has already loaded the kernel, so it is left
# pointing at a path the image build does not create yet.
module_path: boot():/boot/initramfs

# 64-bit little-endian ELF, long mode, higher-half entry point.
kernel_protocol: elf64

# Do not print Limine's banner or menu. The serial log is parsed by the test
# harness, and a banner interleaved with `[NOVA]` lines makes a failure harder to
# read. Limine still reports hard errors on the same console.
quiet: yes

# Emit Limine's own messages on the serial line. Kernel output arrives on the
# same line, so a firmware error appears directly above the kernel's own first
# message — which is usually enough to tell "firmware never started" from
# "firmware started and the kernel hung".
serial: yes