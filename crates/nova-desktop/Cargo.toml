[package]
name = "nova-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NovaOS desktop environment: wallpaper, icons, panel — a Wayland-style desktop shell (no_std, host-testable)"

[lib]
bench = false

[dependencies]
nova-ui = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "deny"
