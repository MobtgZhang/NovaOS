[package]
name = "nova-cap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NovaOS capability table: kernel-trusted authority objects, rights derivation, revocation, and handle generations"

# `no_std` and free of `unsafe`: this crate is a pure algorithm over the
# capability model, so the host test suite exercises exactly the code the
# kernel runs rather than a re-implementation of it.
[dependencies]
nova-abi = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
