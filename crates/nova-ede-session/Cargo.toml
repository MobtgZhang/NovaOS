[package]
name = "nova-ede-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-2.0-or-later"
description = "Rust port of EDE's evoke session manager: startup ordering, splash state, typed settings, and logout/restart/shutdown intents"

[dependencies]
nova-edelib = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "deny"
