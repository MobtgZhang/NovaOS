[package]
name = "nova-boot-menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NovaOS UEFI boot menu application implementing the NovaBoot unified boot protocol menu layer"

[dependencies]
uefi = { version = "0.30", features = ["alloc", "global_allocator", "panic_handler"] }

# The protocol snapshot the menu publishes, and the ELF parser that reads the
# kernel image off the ESP. Both are `no_std` crates shared with the kernel, so
# the snapshot layout and the parse rules are the *same code* on both sides of
# the hand-off.
nova-boot = { workspace = true }
nova-elf = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# The UEFI application is built for a UEFI target (e.g. x86_64-unknown-uefi)
# explicitly, never for the host. It is intentionally absent from
# `default-members` in the workspace Cargo.toml, like `kernel` and `nova-rt`.

[[bin]]
name = "nova-boot-menu"
path = "src/main.rs"
