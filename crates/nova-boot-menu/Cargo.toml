[package]
name = "nova-boot-menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NovaOS UEFI boot menu application implementing the NovaBoot unified boot protocol menu layer"

[dependencies]
nova-boot = { path = "../nova-boot" }
nova-elf = { path = "../nova-elf" }
uefi = { version = "0.30", features = ["alloc", "global_allocator", "panic_handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# The UEFI application is built for a UEFI target (e.g. x86_64-unknown-uefi)
# explicitly, never for the host. It is intentionally absent from
# `default-members` in the workspace Cargo.toml, like `kernel` and `nova-rt`.

[[bin]]
name = "nova-boot-menu"
path = "src/main.rs"
