[package]
name = "nova-ede-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port of EDE's ede-panel: the desktop panel with start menu, quick launch, taskbar and system tray (no_std, host-testable)"

[lib]
bench = false

[dependencies]
nova-ui = { workspace = true }
nova-edelib = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "deny"
