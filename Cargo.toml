[workspace]
# `resolver = "3"` is the edition-2024 resolver. It is required rather than
# merely preferred: with edition 2024 the workspace *must* opt in explicitly, and
# leaving it unset produces a warning that is easy to miss.
resolver = "3"

members = [
    "kernel",
    "crates/nova-abi",
    "crates/nova-boot",
    "crates/nova-boot-menu",
    "crates/nova-cap",
    "crates/nova-core",
    "crates/nova-elf",
    "crates/nova-fs",
    "crates/nova-ipc",
    "crates/nova-net",
    "crates/nova-protocols",
    "crates/nova-user",
    "crates/nova-type",
    "crates/nova-ui",
    "crates/nova-graphic",
    "crates/nova-desktop-server",
    "crates/nova-desktop",
    "crates/nova-edelib",
    "crates/nova-ede-desktop",
    "crates/nova-ede-launch",
    "crates/nova-ede-panel",
    "crates/nova-ede-about",
    "crates/nova-ede-notifyd",
    "crates/nova-ede-tip",
    "crates/nova-ede-session",
    "crates/nova-ede-autostart",
    "crates/nova-ede-bell",
    "crates/nova-ede-keyboard",
    "crates/nova-ede-preferred",
    "crates/nova-ede-screensaver",
    "crates/nova-ede-screen-lock",
    "crates/nova-ede-timedate",
    "crates/nova-ede-calc",
    "crates/nova-ede-image-view",
    "crates/nova-ede-help",
    "crates/nova-ede-dialog",
    "crates/nova-ede-conf",
    "crates/nova-ede-desktop-conf",
    "crates/nova-ede-tip-compiler",
    "crates/nova-ede-crash",
    "crates/nova-ede-bug-report",
    "crates/nova-desktop-server",
    "tools/xtask",
    "user/nova-rt",
    "user/apps",
]

# The members a bare `cargo build` or `cargo test` acts on.
#
# `kernel` and `user/nova-rt` are deliberately absent. Both are `no_std` /
# `no_main` bare-metal binaries with their own `_start` and their own linker
# scripts, and neither can be linked for the host: the host has no
# `#[panic_handler]`, and the `unwinding panics are not supported without std`
# error is what a host build of either one produces.
#
# That error is the trap this field exists to close. Without it, `cargo build`
# in a clean checkout fails with a message about unwinding panics — a problem
# that reads as a broken toolchain and is really a bare-metal binary being
# built for the wrong target. The kernel is built for
# `x86_64-unknown-none` instead, by `cargo nova-build` and by `cargo xtask
# build`; the user runtime is built by the same commands.
#
# `--workspace` still reaches every member, so nothing is hidden from a
# deliberate sweep — it is only the *implicit* default that changes.
default-members = [
    "crates/nova-abi",
    "crates/nova-boot",
    "crates/nova-cap",
    "crates/nova-core",
    "crates/nova-elf",
    "crates/nova-fs",
    "crates/nova-ipc",
    "crates/nova-net",
    "crates/nova-protocols",
    "crates/nova-user",
    "crates/nova-type",
    "crates/nova-ui",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nova-abi = { path = "crates/nova-abi" }
nova-boot = { path = "crates/nova-boot" }
nova-cap = { path = "crates/nova-cap" }
nova-core = { path = "crates/nova-core" }
nova-elf = { path = "crates/nova-elf" }
nova-fs = { path = "crates/nova-fs" }
nova-ipc = { path = "crates/nova-ipc" }
nova-net = { path = "crates/nova-net" }
nova-protocols = { path = "crates/nova-protocols" }
nova-type = { path = "crates/nova-type" }
nova-ui = { path = "crates/nova-ui" }
nova-graphic = { path = "crates/nova-graphic" }
nova-desktop-server = { path = "crates/nova-desktop-server" }
nova-desktop = { path = "crates/nova-desktop" }
nova-edelib = { path = "crates/nova-edelib" }
nova-ede-desktop = { path = "crates/nova-ede-desktop" }
nova-ede-launch = { path = "crates/nova-ede-launch" }
nova-ede-panel = { path = "crates/nova-ede-panel" }
nova-ede-about = { path = "crates/nova-ede-about" }
nova-ede-notifyd = { path = "crates/nova-ede-notifyd" }
nova-ede-tip = { path = "crates/nova-ede-tip" }
nova-ede-session = { path = "crates/nova-ede-session" }
nova-ede-autostart = { path = "crates/nova-ede-autostart" }
nova-ede-bell = { path = "crates/nova-ede-bell" }
nova-ede-keyboard = { path = "crates/nova-ede-keyboard" }
nova-ede-preferred = { path = "crates/nova-ede-preferred" }
nova-ede-screensaver = { path = "crates/nova-ede-screensaver" }
nova-ede-screen-lock = { path = "crates/nova-ede-screen-lock" }
nova-ede-timedate = { path = "crates/nova-ede-timedate" }
nova-ede-calc = { path = "crates/nova-ede-calc" }
nova-ede-image-view = { path = "crates/nova-ede-image-view" }
nova-ede-help = { path = "crates/nova-ede-help" }
nova-ede-dialog = { path = "crates/nova-ede-dialog" }
nova-ede-conf = { path = "crates/nova-ede-conf" }
nova-ede-desktop-conf = { path = "crates/nova-ede-desktop-conf" }
nova-ede-tip-compiler = { path = "crates/nova-ede-tip-compiler" }
nova-ede-crash = { path = "crates/nova-ede-crash" }
nova-ede-bug-report = { path = "crates/nova-ede-bug-report" }
nova-user = { path = "crates/nova-user" }

# Bare-metal kernel profile.
#
# `panic` is deliberately *not* set here. Cargo does not allow it in a package
# override, and setting it workspace-wide would abort the host test harness on a
# failing assertion instead of printing a backtrace. The kernel gets
# `-C panic=abort` from `.cargo/config.toml`, scoped to `target_arch =
# "x86_64-unknown-none"`, so only bare-metal builds see it. This is also why the
# host tests can run without an environment override.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Inherits `dev`, but keeps debug info for the in-kernel fault handler to use in
# M2 when it can walk a frame pointer chain.
[profile.dev.package."*"]
opt-level = 1
