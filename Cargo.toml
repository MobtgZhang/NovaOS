[workspace]
# `resolver = "3"` is the edition-2024 resolver. It is required rather than
# merely preferred: with edition 2024 the workspace *must* opt in explicitly, and
# leaving it unset produces a warning that is easy to miss.
resolver = "3"

members = [
    "kernel",
    "crates/nova-abi",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
limine = "0.6.5"
nova-abi = { path = "crates/nova-abi" }

# Bare-metal kernel profile.
#
# `panic` is deliberately *not* set here. Cargo does not allow it in a package
# override, and setting it workspace-wide would abort the host test harness on a
# failing assertion instead of printing a backtrace. The kernel gets
# `-C panic=abort` from `.cargo/config.toml`, scoped to `target_arch =
# "x86_64-unknown-none"`, so only bare-metal builds see it. This is also why the
# host tests can run without an environment override.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Inherits `dev`, but keeps debug info for the in-kernel fault handler to use in
# M2 when it can walk a frame pointer chain.
[profile.dev.package."*"]
opt-level = 1