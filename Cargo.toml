[workspace]
# `resolver = "3"` is the edition-2024 resolver. It is required rather than
# merely preferred: with edition 2024 the workspace *must* opt in explicitly, and
# leaving it unset produces a warning that is easy to miss.
resolver = "3"

members = [
    "kernel",
    "crates/nova-abi",
    "crates/nova-cap",
    "crates/nova-core",
    "crates/nova-elf",
    "crates/nova-fs",
    "crates/nova-ipc",
    "crates/nova-protocols",
    "tools/xtask",
    "user/nova-rt",
    "user/apps",
]

# The members a bare `cargo build` or `cargo test` acts on.
#
# `kernel` and `user/nova-rt` are deliberately absent. Both are `no_std` /
# `no_main` bare-metal binaries with their own `_start` and their own linker
# scripts, and neither can be linked for the host: the host has no
# `#[panic_handler]`, and the `unwinding panics are not supported without std`
# error is what a host build of either one produces.
#
# That error is the trap this field exists to close. Without it, `cargo build`
# in a clean checkout fails with a message about unwinding panics — a problem
# that reads as a broken toolchain and is really a bare-metal binary being
# built for the wrong target. The kernel is built for
# `x86_64-unknown-none` instead, by `cargo nova-build` and by `cargo xtask
# build`; the user runtime is built by the same commands.
#
# `--workspace` still reaches every member, so nothing is hidden from a
# deliberate sweep — it is only the *implicit* default that changes.
default-members = [
    "crates/nova-abi",
    "crates/nova-cap",
    "crates/nova-core",
    "crates/nova-elf",
    "crates/nova-fs",
    "crates/nova-ipc",
    "crates/nova-protocols",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
limine = "0.6.5"
nova-abi = { path = "crates/nova-abi" }
nova-cap = { path = "crates/nova-cap" }
nova-core = { path = "crates/nova-core" }
nova-elf = { path = "crates/nova-elf" }
nova-fs = { path = "crates/nova-fs" }
nova-ipc = { path = "crates/nova-ipc" }
nova-protocols = { path = "crates/nova-protocols" }

# Bare-metal kernel profile.
#
# `panic` is deliberately *not* set here. Cargo does not allow it in a package
# override, and setting it workspace-wide would abort the host test harness on a
# failing assertion instead of printing a backtrace. The kernel gets
# `-C panic=abort` from `.cargo/config.toml`, scoped to `target_arch =
# "x86_64-unknown-none"`, so only bare-metal builds see it. This is also why the
# host tests can run without an environment override.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Inherits `dev`, but keeps debug info for the in-kernel fault handler to use in
# M2 when it can walk a frame pointer chain.
[profile.dev.package."*"]
opt-level = 1
